<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes</title>
</head>
<body>
    
    <!--id attribute-->
    <p id="intro">This is the introduction paragraph.</p>

    <!--class attribute-->
    <p class="highlight">This paragraph is highlighted using the class attribute.</p>

    <!--title attribute-->
    <p title="This is additional information">Hover over me to see the tooltip.</p>

    <!--style attribute-->
    <p style="color: blue; font-size: 18px;">This paragraph has inline styles applied.</p>

    <!--lang attribute-->
    <p lang="en">This paragraph is in English.</p>

    <!--button attribute-->
    <button id="submit_button" type="button" title="click to submit">Click Me</button>
    <br>

    <!--input attribute-->
    <input id="username" type="text" name="username" placeholder="Enter your username" required />
    <br>

    <input id="email" type="email" name="email" placeholder="Enter your email" required />
    <br

    <!--link attribute-->
    <a href="https://www.google.com" target="_blank">Visit Google</a>
    <br>

    <!--img attribute -->
    <img src="../sample images/premium_bottle.avif" alt="Placeholder Image" width="150" height="150" />

    <img src="https://images.unsplash.com/photo-1787833537662-a65d7fc42012?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzfHx8ZW58MHx8fHx8"   alt="Unsplash Image" width="150" height="150" />


</body>
</html>
